title: PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects PowerShell execution with -EncodedCommand flag, commonly used to obfuscate malicious payloads
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Yavin Security
date: 2026-04-16
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-ec '
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
falsepositives:
  - Legitimate administrative scripts using encoded commands
  - Software deployment tools
level: medium
